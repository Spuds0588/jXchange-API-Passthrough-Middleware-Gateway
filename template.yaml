,"Everything above plus posted transaction history"],["Data aggregator","Balances, status and transaction history, no customer name or address"]].map(([label,sees])=>`<tr><td>${label}</td><td>${sees}</td></tr>`).join("");const OPERATIONS=[["GET","/v1/accounts/{accountId}?type=D","AcctInq"],["GET","/v1/accounts/{accountId}/transactions?type=D&limit=25","AcctHistSrch"],["GET","/v1/customers/{customerId}","CustInq"],["GET","/v1/operations","catalog"]].map(([method,path,core])=>`<tr><td><code>${method}</code></td><td class="path">${path}</td><td><code>${core}</code></td></tr>`).join("");const errorBlock=(error)=>(error?`<div class="error" role="alert">${escapeHtml(error)}</div>`:"");const inviteBlock=(role)=>role?`<section class="invite">
