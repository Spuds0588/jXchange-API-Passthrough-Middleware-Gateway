countId);}const fault=faultOf(upstream.body);if(fault)return coreFault(fault,{operation:"AcctHistSrch",ref:ref(accountId)});if(upstream.statusCode>=300){log("ERROR","JXCHANGE_HTTP_ERROR",{operation:"AcctHistSrch",statusCode:upstream.statusCode});return error(502,"Core banking request failed");}const masked=mask(parseHistory(upstream.body,{accountId}),tenant.persona);if(!masked)return error(403,`Persona ${tenant.persona} has no schema allowlist`);if(!Array.isArray(masked.transactions))return error(403,`Persona ${tenant.persona} cannot read transactions`);log("INFO","HISTORY_READ_COMPLETE",{ref:ref(accountId),count:masked.transactions.length,persona:tenant.persona});return json(200,masked);}async function readCustomer(apiKeyId,customerId){const tenant=await tenantFor(apiKeyId);if(!tenant)return error(403,"Unauthorized tenant mapping");if(!can(tenant.persona,"name"))return error(403,`Persona ${tenant.persona} cannot read customer demographics`);let upstream;try{upstream=await core.customerInquiry({customerId});}catch(err){return upstreamFailure(err,"CustInq",customerId);}const fault=faultOf(upstream.body);if(fault)return coreFault(fault,{operation:"CustInq",ref:ref(customerId)});if(upstream.statusCode>=300){log("ERROR","JXCHANGE_HTTP_ERROR",{operation:"CustInq",statusCode:upstream.statusCode});return error(502,"Core banking request failed");}const masked=mask(parseCustomer(upstream.body,{customerId}),tenant.persona);if(!masked)return error(403,`Persona ${tenant.persona} has no schema allowlist`);if(!masked.name?.full&&!masked.name?.last&&!masked.address?.street){return error(403,`Persona ${tenant.persona} cannot read customer demographics`);}log("INFO","CUSTOMER_READ_COMPLETE",{ref:ref(customerId),persona:tenant.persona});return json(200,masked);}async function provision(event,requestId){let payload;try{payload=JSON.parse(event.body||"");}catch{return error(400,"Invalid JSON body");}const role=String(payload?.role||"").trim().toLowerCase();const config=roleFor(env,role);if(!config||!safeEqual(String(payload?.code||""),config.code)){log("WARN","PORTAL_INVITE_REJECTED",{requestId,role:role||"unknown"});return error(403,"Invalid or expired invite link");}const tenantName=String(payload.tenantName||"").trim();const email=String(payload.email||"").trim();if(!tenantName||tenantName.length>100)return error(400,"tenantName is required (max 100 chars)");if(!email||email.length>254||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return error(400,"A valid email is required");let key;try{key=await store.createApiKey({tenantName});await store.putTenant({apiKeyId:key.id,tenantName,email,role,persona:config.persona,status:"ACTIVE",createdAt:new Date(now()).toISOString()});}catch(err){log("ERROR","TENANT_PROVISION_FAILED",{tenantName,message:err.message});return error(503,"Key store unavailable");}log("INFO","TENANT_PROVISIONED",{tenantName,role,persona:config.persona,apiKeyId:key.id});return json(200,{message:"Tenant provisioned successfully",apiKey:key.value,tenantName,email,role,persona:config.persona});}async function handle(event={}){const method=String(event.httpMethod||event.requestContext?.http?.method||"GET").toUpperCase();const path=event.path||event.rawPath||"/";const requestId=event.requestContext?.requestId;const apiKeyId=event.requestContext?.identity?.apiKeyId;const started=now();log("INFO","REQUEST_RECEIVED",{requestId,method,path});try{if(method==="GET"&&path==="/health")return json(200,{status:"ok",system:"JXchangeGateway",mode:"read-only"});if(path==="/portal"){if(method==="POST")return await provision(event,requestId);if(method!=="GET")return error(405,"Method not allowed");const role=String(event.queryStringParameters?.role||"").trim().toLowerCase();const code=String(event.queryStringParameters?.code||"");if(!role&&!code)return html(200,renderPortal({repo:REPO}));const config=roleFor(env,role);if(!config||!safeEqual(code,config.code)){log("WARN","PORTAL_INVITE_REJECTED",{requestId,role:role||"unknown"});return html(403,renderP