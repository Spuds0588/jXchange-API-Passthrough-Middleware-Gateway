                   location.origin + "/v1/accounts/{accountId}?type=D",
                   location.origin + "/v1/accounts/{accountId}/transactions?type=D",
                   location.origin + "/v1/customers/{customerId}",
                   location.origin + "/v1/operations"
                 ].join(String.fromCharCode(10));
