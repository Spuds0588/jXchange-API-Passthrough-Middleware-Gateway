                 button.textContent = "Generate API key";
               }
             });
             $("copy").addEventListener("click", async () => {
               await navigator.clipboard?.writeText($("apiKey").value);
               $("copy").textContent = "Copied";
             });
             $("again").addEventListener("click", (event) => {
               event.preventDefault();
               hide("result");
               form.reset();
             });
           }
         </script>
         </body>
