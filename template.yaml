AWSTemplateFormatVersion: "2010-09-09"
Description: Jack Henry jXchange API passthrough gateway (SOAP to JSON reads, persona masking, invite portal, static egress IP, read-only).

Parameters:
  JxchangeEndpointUrl:
    Type: String
    MinLength: 8
    AllowedPattern: ^https?://.+
    Description: jXchange ServiceGateway URL supplied by the institution, e.g. https://jxchange.example.com/jxchange/2008/ServiceGateway/ServiceGateway.svc
  InstRtId:
    Type: String
    MinLength: 9
    MaxLength: 9
    AllowedPattern: ^[0-9]{9}$
    Description: Institution routing ID (InstRtId) issued by Jack Henry.
  InstEnv:
    Type: String
    Default: PROD
    AllowedValues: [TEST, PROD]
    Description: jXchange InstEnv value for the endpoint.
  CoreType:
    Type: String
    Default: SILVERLAKE
    AllowedValues: [SILVERLAKE, SYMPITAR]
    Description: Core behind jXchange. Reported to vendors as coreType.
  ValidConsmName:
    Type: String
    MinLength: 1
    Description: Bank-licensed ValidConsmName consumer credential.
  ValidConsmProd:
    Type: String
    MinLength: 1
    Description: Bank-licensed ValidConsmProd consumer product credential.
  AuditUsrId:
    Type: String
    Default: API_GATEWAY
    MinLength: 1
    MaxLength: 40
    Description: AuditUsrId recorded in the core audit log.
  AuditWsId:
    Type: String
    Default: AWS_GATEWAY
    MinLength: 1
    MaxLength: 40
    Description: AuditWsId recorded in the core audit log.
  ClientCertBase64:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional base64 client certificate for mTLS (openssl base64 -A -in cert.pem).
  ClientKeyBase64:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional base64 client private key for mTLS (openssl base64 -A -in key.pem).
  InviteVerification:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Invite code for role=verification.
  InviteLending:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Invite code for role=lending.
  InviteAggregation:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Invite code for role=aggregation.
  DefaultAcctType:
    Type: String
    Default: D
    MinLength: 1
    MaxLength: 4
    Description: Default jXchange AcctType when a vendor omits ?type=.
  LogRetentionInDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3653

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.44.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.44.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.44.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: VpcGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Gateway Lambda egress only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  JxchangeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/jxchange-core"
      SecretString: !Sub |
        {
          "endpointUrl": "${JxchangeEndpointUrl}",
          "instRtId": "${InstRtId}",
          "instEnv": "${InstEnv}",
          "coreType": "${CoreType}",
          "validConsmName": "${ValidConsmName}",
          "validConsmProd": "${ValidConsmProd}",
          "auditUsrId": "${AuditUsrId}",
          "auditWsId": "${AuditWsId}",
          "clientCertBase64": "${ClientCertBase64}",
          "clientKeyBase64": "${ClientKeyBase64}"
        }

  TenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: apiKeyId
          AttributeType: S
      KeySchema:
        - AttributeName: apiKeyId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: gateway-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt TenantsTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref JxchangeSecret
              - Effect: Allow
                Action: apigateway:POST
                Resource:
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/${UsagePlan}/keys"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-gateway:*"

  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-gateway"
      RetentionInDays: !Ref LogRetentionInDays

  GatewayFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-gateway"
      Description: jXchange SOAP to JSON read gateway
      Runtime: nodejs20.x
      Handler: index.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 29
      Role: !GetAtt GatewayRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          TENANT_TABLE: !Ref TenantsTable
          JXCHANGE_SECRET_ARN: !Ref JxchangeSecret
          USAGE_PLAN_ID: !Ref UsagePlan
          CORE_TYPE: !Ref CoreType
          DEFAULT_ACCT_TYPE: !Ref DefaultAcctType
          INVITE_VERIFICATION: !Ref InviteVerification
          INVITE_LENDING: !Ref InviteLending
          INVITE_AGGREGATION: !Ref InviteAggregation
          UPSTREAM_TIMEOUT_MS: "8000"
      Code:
        ZipFile: |
         "use strict";const __nativeRequire=require;const __defs={"lambda.js":(module,exports,require)=>{const{createApp}=require("./app");const{createJxchange,decodeSecret}=require("./jxchange");function createHandler({store,env=process.env,core,now=()=>Date.now()}){let client=core||null;const getCore=async()=>{if(!client){const secret=decodeSecret(await store.getSecret());client=createJxchange({...secret,coreType:env.CORE_TYPE||secret.coreType,timeoutMs:env.UPSTREAM_TIMEOUT_MS});}return client;};const lazyCore={accountInquiry:async(params)=>(await getCore()).accountInquiry(params),accountHistory:async(params)=>(await getCore()).accountHistory(params),customerInquiry:async(params)=>(await getCore()).customerInquiry(params)};const app=createApp({store,core:lazyCore,env,now});return async function handler(event={},context){return app.handle(event,context);};}let defaultHandler=null;exports.handler=async(event,context)=>{if(!defaultHandler){const{createAwsStore}=require("./aws-store");defaultHandler=createHandler({store:createAwsStore(process.env)});}return defaultHandler(event,context);};exports.createHandler=createHandler;},"app.js":(module,exports,require)=>{const{log}=require("./log");const{mask,ALLOWLISTS}=require("./mask");const{roleFor,safeEqual}=require("./roles");const{renderPortal}=require("./portal");const{faultOf,parseAccount,parseHistory,parseCustomer}=require("./jxchange");const MAX_LIMIT=100;const DEFAULT_LIMIT=25;const ID=/^[A-Za-z0-9._:-]{1,40}$/;const ACCT_TYPE=/^[A-Za-z]{1,4}$/;const DATE=/^\d{4}-\d{2}-\d{2}$/;const REPO="https://github.com/Spuds0588/jXchange-API-Passthrough-Middleware-Gateway";const json=(statusCode,body,headers={})=>({statusCode,headers:{"Content-Type":"application/json","Cache-Control":"no-store",...headers},body:JSON.stringify(body)});const error=(statusCode,message,extra={})=>json(statusCode,{error:message,...extra});const html=(statusCode,body)=>({statusCode,headers:{"Content-Type":"text/html; charset=utf-8","Cache-Control":"n