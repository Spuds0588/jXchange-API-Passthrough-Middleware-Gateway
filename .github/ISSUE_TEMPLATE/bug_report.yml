name: Bug report
description: Something in the gateway, template, or docs is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This project is community supported: the maintainer has no Jack Henry access
        and no AWS account for it, so your report is how defects get found. Read `CONTRIBUTING.md` first.
  - type: input
    id: commit
    attributes:
      label: Commit SHA you tested
      placeholder: e.g. 48d9c6d
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: What did you run against?
      options:
        - Local fake core (npm run dev / npm test)
        - Deployed AWS stack
        - Real jXchange core
        - Docs or template inspection only
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the HTTP status and the response body, with secrets and identifiers redacted.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy with ...
        2. Provision a lending key ...
        3. GET /v1/accounts/...?type=D
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: npm run verify result
      description: Paste the summary line.
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: I removed API keys, invite codes, certificates, account numbers, customer data, and full upstream payloads.
          required: true
        - label: I did not claim a live Jack Henry or AWS verification that did not happen.
          required: true
